services:
  - type: web
    name: the-academia-api
    runtime: node
    plan: starter
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: academia-uploads
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        value: https://the-academia-web.onrender.com
      - key: GOOGLE_CALLBACK_URL
        value: https://the-academia-api.onrender.com/auth/google/callback
      - key: GOOGLE_MOBILE_CALLBACK_URL
        value: https://the-academia-api.onrender.com/auth/google/mobile/callback
      - key: STORAGE_DIR
        value: /var/data/notes
      - key: MONGODB_URI
        sync: false
      - key: JWT_KEY
        generateValue: true
      - key: EXPRESS_SESSION_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

  - type: web
    name: the-academia-web
    runtime: static
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
