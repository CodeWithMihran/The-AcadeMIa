<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png?v=20261012" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=20261012" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (() => {
        let theme = 'light';
        try {
          const saved = window.localStorage.getItem('academia-theme');
          theme = saved === 'light' || saved === 'dark'
            ? saved
            : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        } catch {
          theme = window.matchMedia?.('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <meta name="theme-color" content="#101116" />
    <meta name="application-name" content="The AcadeMIa" />
    <meta name="description" content="The AcadeMIa is your academic workspace for subjects, exam revision, study tools, progress, and campus learning." />
    <title>The AcadeMIa | Academic OS</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
